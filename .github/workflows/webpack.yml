name: Validate InnWeb OS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install locked dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run db:generate
      env:
        DATABASE_URL: postgresql://test:test@127.0.0.1:5432/innweb_ci
        DIRECT_URL: postgresql://test:test@127.0.0.1:5432/innweb_ci

    - name: Validate CSV imports and application
      run: |
        npm test
        npm run lint
        npm run build -- --webpack
