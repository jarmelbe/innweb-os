name: Dependency security check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install without running dependency scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Report high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
